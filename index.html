<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find Your Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon-1: #6E1526;
    --maroon-2: #3A0B15;
    --plaque: #FBF3DD;
    --ink: #3A0E16;
    --ink-soft: #7A4B52;
    --cream: #F3E4BE;
    --cream-soft: #D8BE93;
    --gold: #D8B268;
    --gold-deep: #B8863C;
    --line: rgba(216, 178, 104, 0.4);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(circle at 50% 15%, var(--maroon-1) 0%, var(--maroon-2) 65%, #260610 100%);
    color: var(--cream);
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    min-height: 100%;
  }
  .frame {
    width: 100%;
    max-width: 440px;
    border: 1.5px solid var(--gold);
    border-radius: 28px 28px 18px 18px;
    padding: 3px;
  }
  .frame-inner {
    border: 1px solid rgba(216,178,104,0.55);
    border-radius: 24px 24px 15px 15px;
    padding: 40px 26px 34px;
  }
  .mark {
    text-align: center;
    font-size: 20px;
    color: var(--gold);
    margin-bottom: 16px;
  }
  .welcome {
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(17px, 4.6vw, 19px);
    line-height: 1.45;
    text-align: center;
    margin: 0 0 6px;
    color: var(--cream);
    max-width: 28ch;
    margin-left: auto;
    margin-right: auto;
  }
  .names {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(30px, 9vw, 40px);
    line-height: 1.1;
    text-align: center;
    margin: 10px 0 18px;
    color: var(--gold);
  }
  .rule {
    width: 36px;
    height: 2px;
    background: var(--gold);
    margin: 0 auto 22px;
    opacity: 0.8;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: clamp(22px, 6vw, 27px);
    line-height: 1.15;
    text-align: center;
    margin: 0 0 10px;
    color: var(--cream);
  }
  .sub {
    text-align: center;
    color: var(--cream-soft);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 28px;
    max-width: 34ch;
    margin-left: auto;
    margin-right: auto;
  }
  .search-wrap { position: relative; margin-bottom: 14px; }
  input[type="text"] {
    width: 100%;
    font-family: "Work Sans", sans-serif;
    font-size: 17px;
    padding: 16px 18px;
    border-radius: 10px;
    border: 1.5px solid var(--gold-deep);
    background: var(--plaque);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="text"]:focus { border-color: var(--gold); }
  input[type="text"]::placeholder { color: var(--ink-soft); }

  .results {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .result-btn {
    text-align: left;
    width: 100%;
    font-family: "Work Sans", sans-serif;
    font-size: 16px;
    color: var(--ink);
    background: var(--plaque);
    border: 1.5px solid var(--gold-deep);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  .result-btn:hover { border-color: var(--maroon-1); }
  .result-btn:active { transform: scale(0.99); }
  .result-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .hint {
    text-align: center;
    color: var(--cream-soft);
    font-size: 13.5px;
    margin-top: 18px;
    line-height: 1.5;
  }

  .reveal {
    background: var(--plaque);
    border: 1.5px solid var(--gold-deep);
    border-radius: 14px;
    padding: 34px 26px;
    text-align: center;
    animation: rise 0.35s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .reveal .party {
    font-family: "Fraunces", Georgia, serif;
    font-size: 22px;
    margin-bottom: 22px;
    color: var(--ink);
  }
  .reveal .table-label {
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--maroon-1);
    margin-bottom: 6px;
  }
  .reveal .table-num {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 64px;
    line-height: 1;
    color: var(--maroon-2);
  }
  .back-btn {
    display: block;
    margin: 22px auto 0;
    background: none;
    border: none;
    color: var(--cream-soft);
    font-family: "Work Sans", sans-serif;
    font-size: 14.5px;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px;
  }

  .empty {
    text-align: center;
    color: var(--cream-soft);
    font-size: 15px;
    padding: 18px 4px 4px;
    line-height: 1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; }
    .result-btn { transition: none; }
  }
</style>
</head>
<body>
  <div class="frame"><div class="frame-inner">
    <div id="app"></div>
  </div></div>

<script>
  // Party -> table data. Each party may cover multiple guests / a family.
  const PARTIES = [
    {d:"Ajay & Anupma + 1", t:1},
    {d:"Ajendra & Sangeeta", t:3},
    {d:"Amit Bhatia & Shveta + 1", t:3},
    {d:"Amit Mahajan & Anshu + 2", t:7},
    {d:"Brian & Ashra + 1", t:5},
    {d:"Dhiresh & Aparna", t:3},
    {d:"Dinesh Jain & Archana", t:8},
    {d:"Dipak Gupta & Shilpy", t:7},
    {d:"Dipak Maurya & Anu + 2", t:9},
    {d:"Dipak Sahoo & Sweta + 1", t:3},
    {d:"George & Raji", t:5},
    {d:"Hiten & Swati", t:4},
    {d:"Kranti", t:9},
    {d:"Lucky & Bobby + 2", t:2},
    {d:"Madhu & Shanti", t:4},
    {d:"Manish Jain & Sanjana + 2", t:8},
    {d:"Aditi & Meenal", t:1},
    {d:"Narendra Soni & Sangeeta", t:1},
    {d:"Nasir & Shabnam + 2", t:4},
    {d:"Nilesh & Anita", t:6},
    {d:"Rajiv A & Shipra + 2", t:8},
    {d:"Rama & Anju + 3", t:5},
    {d:"Sachin & Seema + 2", t:6},
    {d:"Sam & Aneesha", t:0},
    {d:"Sapna + 2", t:2},
    {d:"Saurabh & Rashmi + 1", t:7},
    {d:"Srinivas & Sreesha", t:4},
    {d:"Vaishali", t:6},
    {d:"Vijay & Priya + 1", t:2},
    {d:"Vinodan & Nirmala", t:9},
    {d:"Vishnu & Renu", t:9},
    {d:"Anna Cottrell", t:11},
    {d:"Ben Ellis", t:12},
    {d:"Brian & Jennifer", t:15},
    {d:"Cade & LeAnne", t:15},
    {d:"Carter Bell + 1", t:10},
    {d:"Clemens Yao", t:12},
    {d:"Emily Saechao", t:12},
    {d:"Emma", t:12},
    {d:"Enrique Cardenas", t:12},
    {d:"Ethan Coffey", t:12},
    {d:"Ethan West", t:12},
    {d:"Gramma Carol", t:15},
    {d:"Grandma Patty", t:15},
    {d:"Grandpa Bob", t:15},
    {d:"Heinz Joseph", t:11},
    {d:"Isabella McLaughlin", t:11},
    {d:"Jason Johnson-Yurchak", t:10},
    {d:"Katie Kostas + 1", t:11},
    {d:"Kendra Jensen + 1", t:10},
    {d:"Kristie Chen", t:11},
    {d:"Max Johnson", t:11},
    {d:"Max Wood", t:12},
    {d:"Sage Myers", t:15},
    {d:"Seaeun Lee + 1", t:11},
    {d:"Shawn Kim", t:12},
    {d:"Valeria Armas + 1", t:10},
    {d:"William Zhou + 1", t:10},
    {d:"Zill Patel", t:11},
  ];

  function tokenize(str) {
    return str.toLowerCase()
      .replace(/[+&-]/g, " ")
      .split(/[^a-z]+/)
      .filter(t => t.length > 1);
  }

  PARTIES.forEach(p => { p.tokens = tokenize(p.d); });

  const app = document.getElementById("app");

  function render(html) { app.innerHTML = html; }

  function renderSearch(query, matches) {
    let resultsHtml = "";
    if (query.trim().length < 2) {
      resultsHtml = "";
    } else if (matches.length === 0) {
      resultsHtml = `<div class="empty">No match for "${escapeHtml(query)}". Check the spelling, or ask a member of the wedding party for help.</div>`;
    } else {
      resultsHtml = `<div class="results">` + matches.map((p, i) =>
        `<button class="result-btn" data-idx="${p._idx}">${escapeHtml(p.d)}</button>`
      ).join("") + `</div>`;
    }

    render(`
      <div class="mark">&#10052;</div>
      <p class="welcome">Welcome to the wedding reception for</p>
      <div class="names">Aneesha &amp; Samuel</div>
      <div class="rule"></div>
      <h1>Find your table</h1>
      <p class="sub">Type your first name below to see where you're seated.</p>
      <div class="search-wrap">
        <input type="text" id="search" placeholder="Your first name" autocomplete="off" autocapitalize="words" value="${escapeHtml(query)}" />
      </div>
      ${resultsHtml}
      <p class="hint">Seated with family or a partner? Your whole party will show together once you tap your name.</p>
    `);

    const input = document.getElementById("search");
    input.addEventListener("input", onInput);
    input.focus();
    if (query) {
      const val = input.value;
      input.value = "";
      input.value = val;
    }

    app.querySelectorAll(".result-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = parseInt(btn.getAttribute("data-idx"), 10);
        renderReveal(PARTIES[idx]);
      });
    });
  }

  function renderReveal(party) {
    render(`
      <div class="reveal">
        <div class="party">${escapeHtml(party.d)}</div>
        <div class="table-label">Your table number is</div>
        <div class="table-num">${party.t}</div>
      </div>
      <button class="back-btn" id="backBtn">&larr; Search another name</button>
    `);
    document.getElementById("backBtn").addEventListener("click", () => renderSearch("", []));
  }

  function onInput(e) {
    const query = e.target.value;
    const q = query.trim().toLowerCase();
    let matches = [];
    if (q.length >= 2) {
      matches = PARTIES
        .map((p, idx) => ({ ...p, _idx: idx }))
        .filter(p => p.tokens.some(tok => tok.startsWith(q)));
    }
    renderSearch(query, matches);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  renderSearch("", []);
</script>
</body>
</html>
